version: "3"

services:

  gws:
    image: gws:latest
    build:
      context: ../
    command: ["--runserver", "(LAB_NAME)"]
    ports:
      - 80:3000
      - 8888:8888
    environment:
      - LAB_NAME:(LAB_NAME)
      - START_MODE:(START_MODE)
    volumes:
      - (APP_DIR):/app/gws/
    restart: always
