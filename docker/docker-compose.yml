version: "3"

services:

  gws:
    build:
      context: ../
      args:
        APPDIR: /app/gws
        LABNAME: mylab
      
    image: gws:latest
    ports:
      - 3000:80
    environment:
       - VIRTUAL_HOST=lab.gencovery.com
       - LETSENCRYPT_HOST=lab.gencovery.com
       - LETSENCRYPT_EMAIL=admin@gencovery.com
    volumes:
      - /home/ubuntu/work:/app/gws/user
      - /app/gws-data:/app/gws/gws/data
      - /app/gws-logs:/app/gws/gws/logs
    networks:
       - nginx-proxy
    restart: always
    
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /app/nginx/vhost.d:/etc/nginx/vhost.d
      - /app/nginx/certs:/etc/nginx/certs:ro
      - /app/nginx/html:/usr/share/nginx/html
      - /app/nginx/conf.d/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf:ro
    labels:
      com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy: "true"
    networks:
      - nginx-proxy
    restart: always

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /app/nginx/vhost.d:/etc/nginx/vhost.d
      - /app/nginx/certs:/etc/nginx/certs:rw
      - /app/nginx/html:/usr/share/nginx/html
    volumes_from:
      - nginx-proxy
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: false
