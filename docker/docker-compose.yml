version: "3"

services:
  gws:
    image: gws:latest
    build:
      context: ../
    command: ["--runserver", "(LAB_NAME)"]
    ports:
      - 80:3000
      - 8888:8888
    environment:
      - LAB_NAME:(LAB_NAME)
      - START_MODE:(START_MODE)
      - VIRTUAL_HOST=*.glab.gencovery.com
      - LETSENCRYPT_HOST=*.glab.gencovery.com
      - LETSENCRYPT_EMAIL=admin@gencovery.com
    volumes:
      - (APP_DIR):/app/gws/
    networks:
       - nginx-proxy
    restart: always
    
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - 80:80
      - 443:443
      - 8888:8888
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /app/nginx/vhost.d:/etc/nginx/vhost.d
      - /app/nginx/certs:/etc/nginx/certs:ro
      - /app/nginx/html:/usr/share/nginx/html
      - /app/nginx/conf.d/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf:ro
    labels:
      com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy: "true"
    networks:
      - nginx-proxy
    restart: always

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /app/nginx/vhost.d:/etc/nginx/vhost.d
      - /app/nginx/certs:/etc/nginx/certs:rw
      - /app/nginx/html:/usr/share/nginx/html
    volumes_from:
      - nginx-proxy
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: false
