# Build and push glab, codelab, and lab-dev-env images to Docker Hub
# under the constellab organization. Triggered on tag push.

name: Publish Docker image

on:
  push:
    tags:
      - '*'

env:
  ORGANIZATION: constellab

jobs:
  # Run the python test suite first; nothing is built or pushed if it fails.
  # Tests marked requires_network are skipped: they install from real PyPI, so
  # they are slow and would tie a release to PyPI being up. Everything else,
  # brick installation included, runs offline against a local git registry.
  test:
    name: Run tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v7.0.0
        with:
          # Matches the python version shipped in the glab image.
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pytest
        run: pytest -m "not requires_network"

  # Build the base glab image in both CPU and GPU variants in parallel.
  glab:
    name: Build glab (${{ matrix.variant }})
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            source: ubuntu:22.04
            tag_prefix: ""
            push_description: "true"
          - variant: gpu
            source: nvidia/cuda:12.4.1-runtime-ubuntu22.04
            tag_prefix: gpu-
            push_description: "false"
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v4.0.0

      - uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: ./.github/actions/docker-build-and-push
        with:
          container_name: glab
          source_image: ${{ matrix.source }}
          tag_prefix: ${{ matrix.tag_prefix }}
          version: ${{ github.ref_name }}
          organization: ${{ env.ORGANIZATION }}
          push_description: ${{ matrix.push_description }}
          dockerhub_username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub_password: ${{ secrets.DOCKER_PASSWORD }}

  # Downstream images (codelab, lab-dev-env) build from the just-published glab image.
  # They do not depend on each other, so they run in parallel.
  # lab-dev-env is CPU-only; GPU lane builds only codelab.
  downstream:
    name: Build ${{ matrix.container }} (${{ matrix.variant }})
    needs: glab
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, gpu]
        container: [codelab, lab-dev-env]
        exclude:
          - variant: gpu
            container: lab-dev-env
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v4.0.0

      - uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: ./.github/actions/docker-build-and-push
        with:
          container_name: ${{ matrix.container }}
          source_image: ${{ env.ORGANIZATION }}/glab:${{ matrix.variant == 'gpu' && 'gpu-' || '' }}${{ github.ref_name }}
          tag_prefix: ${{ matrix.variant == 'gpu' && 'gpu-' || '' }}
          version: ${{ github.ref_name }}
          organization: ${{ env.ORGANIZATION }}
          cache_mode: min
          push_description: ${{ matrix.variant == 'cpu' && 'true' || 'false' }}
          dockerhub_username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub_password: ${{ secrets.DOCKER_PASSWORD }}
