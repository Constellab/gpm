# Action to build image from dockerfile, then push it to dockerhub to constellab organization

name: Publish Docker image

on:
  push:
    tags:
      - '*'

env:
  ORGANIZATION: constellab

jobs:
  prepare:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6.0.2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build-cpu-glab-and-codelab:
    name: Push cpu glab and codelab Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/docker-build-and-push
        with:
          container_name: "glab"
          source_image: "ubuntu:22.04"
          version: ${{ github.ref_name }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          organization: ${{ env.ORGANIZATION }}
          push_description: true

      - uses: ./.github/actions/docker-build-and-push
        with:
          container_name: "codelab"
          source_image: ${{ env.ORGANIZATION }}/glab:${{ github.ref_name }}
          version: ${{ github.ref_name }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          organization: ${{ env.ORGANIZATION }}
          push_description: true

      - uses: ./.github/actions/docker-build-and-push
        with:
          container_name: "lab-dev-env"
          source_image: ${{ env.ORGANIZATION }}/glab:${{ github.ref_name }}
          version: ${{ github.ref_name }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          organization: ${{ env.ORGANIZATION }}
          push_description: true
    
    

  # Build the GPU images, container tagged with gpu-[version]
  build-gpu-glab-and-codelab:
    name: Push gpu glab and codelab Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/docker-build-and-push
        with:
          container_name: "glab"
          source_image: "nvidia/cuda:12.4.1-runtime-ubuntu22.04"
          tag_prefix: gpu-
          version: ${{ github.ref_name }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          organization: ${{ env.ORGANIZATION }}

      - uses: ./.github/actions/docker-build-and-push
        with:
          container_name: "codelab"
          source_image: ${{ env.ORGANIZATION }}/glab:gpu-${{ github.ref_name }}
          tag_prefix: gpu-
          version: ${{ github.ref_name }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          organization: ${{ env.ORGANIZATION }}
