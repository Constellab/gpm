# Action to build and push a Dockerfile-based image (glab, codelab, lab-dev-env)
# to Docker Hub. Supports CPU and GPU variants via tag_prefix.
# Expects the caller to have already run docker/login-action and docker/setup-buildx-action.

name: Build and push Docker image
description: Build and push a Docker image to Docker Hub with CPU/GPU variant support

inputs:
  container_name:
    required: true
    type: string
  source_image:
    required: true
    type: string
  tag_prefix:
    required: false
    type: string
    default: ""
  version:
    required: true
    type: string
  organization:
    required: true
    type: string
  cache_mode:
    required: false
    type: string
    default: max
  push_description:
    required: false
    type: boolean
    default: false
  dockerhub_username:
    required: false
    type: string
    default: ""
  dockerhub_password:
    required: false
    type: string
    default: ""

runs:
  using: "composite"
  steps:
    - name: Build and push image
      uses: docker/build-push-action@v7.3.0
      with:
        context: .
        file: ./dockerfile/${{ inputs.container_name }}/Dockerfile
        push: true
        provenance: false
        tags: |
          ${{ inputs.organization }}/${{ inputs.container_name }}:${{ inputs.tag_prefix }}latest
          ${{ inputs.organization }}/${{ inputs.container_name }}:${{ inputs.tag_prefix }}${{ inputs.version }}
        build-args: |
          IMAGE=${{ inputs.source_image }}
        cache-from: type=gha,scope=${{ inputs.tag_prefix }}${{ inputs.container_name }}
        cache-to: type=gha,mode=${{ inputs.cache_mode }},scope=${{ inputs.tag_prefix }}${{ inputs.container_name }}

    - name: Push Docker Hub description
      if: ${{ inputs.push_description == 'true' }}
      uses: peter-evans/dockerhub-description@v5.0.0
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_password }}
        repository: ${{ inputs.organization }}/${{ inputs.container_name }}
        readme-filepath: ./dockerfile/${{ inputs.container_name }}/README.md
