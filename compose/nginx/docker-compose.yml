version: "3"

services:
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /srv/nginx-proxy/nginx/vhost.d:/etc/nginx/vhost.d
      - /srv/nginx-proxy/nginx/certs:/etc/nginx/certs:ro
      - /srv/nginx-proxy/nginx/html:/usr/share/nginx/html
      - /srv/nginx-proxy/nginx/conf.d/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf:ro
    labels:
      com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy: "true"
    networks:
      - nginx-proxy
    restart: always

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/nginx-proxy/nginx/vhost.d:/etc/nginx/vhost.d
      - /srv/nginx-proxy/nginx/certs:/etc/nginx/certs:rw
      - /srv/nginx-proxy/nginx/html:/usr/share/nginx/html
    volumes_from:
      - nginx-proxy
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: false
