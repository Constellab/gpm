version: "3"

services:

  # GWS
  gws:
    image: gws:latest
    build:
      context: ./
    command: ["--runserver", "(LAB_NAME)"]
    environment:
      - LAB_NAME=(LAB_NAME)
      - LAB_TOKEN=(LAB_TOKEN)
      - LAB_URI=(LAB_URI)
      - START_MODE=(START_MODE)
      - VIRTUAL_PORT=3000
      - VIRTUAL_HOST=lab.(VIRTUAL_HOST)
      - LETSENCRYPT_HOST=lab.(VIRTUAL_HOST)
      - LETSENCRYPT_EMAIL=admin@gencovery.com
    volumes:
      - (APP_DIR):/app/gws/
      - (BIODATA_VOLUME)
    networks:
       - nginx-proxy
    restart: always
  
  # Jupiter lab
  jlab:
    image: jlab:latest
    build:
      context: ./docker-jlab
    command: ["--runserver"]
    environment:
      - VIRTUAL_PORT=8888
      - VIRTUAL_HOST=jlab.(VIRTUAL_HOST)
      - LETSENCRYPT_HOST=jlab.(VIRTUAL_HOST)
      - LETSENCRYPT_EMAIL=admin@gencovery.com
      - JLAB_TOKEN=(JLAB_TOKEN)
      - JLAB_HOME_DIR=(JLAB_HOME_DIR)
    volumes:
      - (APP_DIR):/app/gws/
    networks:
       - nginx-proxy
    restart: always
  
  # Reverse proxy
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /app/nginx/vhost.d:/etc/nginx/vhost.d
      - /app/nginx/certs:/etc/nginx/certs:ro
      - /app/nginx/html:/usr/share/nginx/html
      - (APP_DIR)/.nginx/conf.d/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf:ro
    labels:
      com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy: "true"
    networks:
      - nginx-proxy
    restart: always

  # Letsencrypt
  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    environment:
      - NGINX_PROXY_CONTAINER:nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /app/nginx/vhost.d:/etc/nginx/vhost.d
      - /app/nginx/certs:/etc/nginx/certs:rw
      - /app/nginx/html:/usr/share/nginx/html
    networks:
      - nginx-proxy
    depends_on:
      - nginx-proxy
    restart: always

networks:
  nginx-proxy:
    external: false
