version: "3"

services:

  # GWS
  gws:
    image: gws:latest
    build:
      context: ./
      dockerfile: .Dockerfile-gws
    command: ["--runserver", "(LAB_NAME)"]
    environment:
      - LAB_URI=(LAB_URI)
      - LAB_NAME=(LAB_NAME)
      - LAB_TOKEN=(LAB_TOKEN)
      - LAB_WORK_DIR=(LAB_WORK_DIR)
      - LAB_START_MODE=(LAB_START_MODE)
      - VIRTUAL_PORT=3000
      - VIRTUAL_HOST=lab.(VIRTUAL_HOST)
      - LETSENCRYPT_HOST=lab.(VIRTUAL_HOST)
      - LETSENCRYPT_EMAIL=admin@gencovery.com
      - CONDA_VERSION=latest
      - GPU=(GPU)
    volumes:
      - (APP_DIR):/app/lab/
    networks:
       - nginx-proxy
    restart: always
  
  # Jupiter lab
  jlab:
    image: jlab:latest
    build:
      context: ./
      dockerfile: .Dockerfile-jlab
    command: ["--runserver"]
    environment:
      - LAB_URI=(LAB_URI)
      - LAB_NAME=(LAB_NAME)
      - LAB_TOKEN=(LAB_TOKEN)
      - LAB_WORK_DIR=(LAB_WORK_DIR)
      - LAB_START_MODE=(START_MODE)
      - VIRTUAL_PORT=8888
      - VIRTUAL_HOST=jlab.(VIRTUAL_HOST)
      - LETSENCRYPT_HOST=jlab.(VIRTUAL_HOST)
      - LETSENCRYPT_EMAIL=admin@gencovery.com
      - CONDA_VERSION=latest
      - GPU=(GPU)
    volumes:
      - (APP_DIR):/app/lab/
    networks:
       - nginx-proxy
    restart: always
  
  # VSCode lab
  vlab:
    image: vlab:latest
    build:
      context: ./
      dockerfile: .Dockerfile-vlab
    command: ["--runserver"]
    environment:
      - LAB_URI=(LAB_URI)
      - LAB_NAME=(LAB_NAME)
      - LAB_TOKEN=(LAB_TOKEN)
      - LAB_WORK_DIR=(LAB_WORK_DIR)
      - LAB_START_MODE=(LAB_START_MODE)
      - VIRTUAL_PORT=8080
      - VIRTUAL_HOST=vlab.(VIRTUAL_HOST)
      - LETSENCRYPT_HOST=vlab.(VIRTUAL_HOST)
      - LETSENCRYPT_EMAIL=admin@gencovery.com
      - CONDA_VERSION=latest
      - GPU=(GPU)
    volumes:
      - (APP_DIR):/app/lab/
    networks:
       - nginx-proxy
    restart: always
    
  # VS code lab
  #vs-code-server:
  #  image: codercom/code-server 
  #  ports:
  #    - "8080:8080"
  #  container_name: vs-code-server
  #  volumes:
  #    - type: bind
  #      source: (APP_DIR)
  #      target: /home/coder/project
  #    - type: bind
  #      source: ./vs-code-server-config
  #      target: /home/coder/.config 
  
  # Reverse proxy
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /app/nginx/vhost.d:/etc/nginx/vhost.d
      - /app/nginx/certs:/etc/nginx/certs:ro
      - /app/nginx/html:/usr/share/nginx/html
      - (APP_DIR)/.nginx/conf.d/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf:ro
    labels:
      com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy: "true"
    networks:
      - nginx-proxy
    restart: always

  # Letsencrypt
  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    environment:
      - NGINX_PROXY_CONTAINER:nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /app/nginx/vhost.d:/etc/nginx/vhost.d
      - /app/nginx/certs:/etc/nginx/certs:rw
      - /app/nginx/html:/usr/share/nginx/html
    networks:
      - nginx-proxy
    depends_on:
      - nginx-proxy
    restart: always

networks:
  nginx-proxy:
    external: false
