image: docker:latest
services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay2
  GIT_DEPTH: 0
  CPU: cpu
  GPU: gpu
  GLAB: glab
  CODELAB: codelab

stages:
  - build-cpu-glab-and-codelab
  - build-gpu-glab-and-codelab
  - build-cpu-codelab
  - build-gpu-codelab
  - release-cpu
  - release-gpu

# /!\ Gitlab runner have 20Go of disk space, so the docker build must be optimized to generate
# less layers.
#  Build the glab cpu images and push them to the registry
build-cpu-glab-and-codelab:
  stage: build-cpu-glab-and-codelab
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build the gws (GLAB) image
    - docker build --build-arg IMAGE="ubuntu:20.04" --tag $CI_REGISTRY_IMAGE/$GLAB-$CPU:$CI_COMMIT_TAG . -f dockerfile/$GLAB/Dockerfile
    # Push image in the registry
    - docker push $CI_REGISTRY_IMAGE/$GLAB-$CPU:$CI_COMMIT_TAG

    # Build the code server (CODELAB) image
    - docker build --build-arg IMAGE="$CI_REGISTRY_IMAGE/$GLAB-$CPU:$CI_COMMIT_TAG" --tag $CI_REGISTRY_IMAGE/$CODELAB-$CPU:$CI_COMMIT_TAG . -f dockerfile/$CODELAB/Dockerfile
    # Push image in the registry
    - docker push $CI_REGISTRY_IMAGE/$CODELAB-$CPU:$CI_COMMIT_TAG
  only:
    - tags


#  Build the glab gpu images and push them to the registry
build-gpu-glab-and-codelab:
  stage: build-gpu-glab-and-codelab
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build the gws (GLAB) image 
    - docker build --build-arg IMAGE="nvidia/cuda:11.2.1-runtime-ubuntu20.04" --tag $CI_REGISTRY_IMAGE/$GLAB-$GPU:$CI_COMMIT_TAG . -f dockerfile/$GLAB/Dockerfile
    # Push image in the registry
    - docker push $CI_REGISTRY_IMAGE/$GLAB-$GPU:$CI_COMMIT_TAG

    # Build the code server (CODELAB)
    - docker build --build-arg IMAGE="$CI_REGISTRY_IMAGE/$GLAB-$GPU:$CI_COMMIT_TAG" --tag $CI_REGISTRY_IMAGE/$CODELAB-$GPU:$CI_COMMIT_TAG . -f dockerfile/$CODELAB/Dockerfile
    # Push image in the registry
    - docker push $CI_REGISTRY_IMAGE/$CODELAB-$GPU:$CI_COMMIT_TAG
  only:
    - tags
  when: manual

#  Build the codelab cpu images and push them to the registry
build-cpu-codelab:
  stage: build-cpu-codelab
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build the code server (CODELAB) image 
    - docker build --build-arg IMAGE="$CI_REGISTRY_IMAGE/$GLAB-$CPU:$CI_COMMIT_TAG" --tag $CI_REGISTRY_IMAGE/$CODELAB-$CPU:$CI_COMMIT_TAG . -f dockerfile/$CODELAB/Dockerfile
    # Push image in the registry
    - docker push $CI_REGISTRY_IMAGE/$CODELAB-$CPU:$CI_COMMIT_TAG

  only:
    - tags
  when: manual

#  Build the codelab gpu images and push them to the registry
build-gpu-codelab:
  stage: build-gpu-codelab
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build the code server (CODELAB) image
    - docker build --build-arg IMAGE="$CI_REGISTRY_IMAGE/$GLAB-$GPU:$CI_COMMIT_TAG" --tag $CI_REGISTRY_IMAGE/$CODELAB-$GPU:$CI_COMMIT_TAG . -f dockerfile/$CODELAB/Dockerfile
    # Push image in the registry
    - docker push $CI_REGISTRY_IMAGE/$CODELAB-$GPU:$CI_COMMIT_TAG
  only:
    - tags
  when: manual

 
