# rsyslog configuration for container environment
# Disable imklog (kernel logging) as it's not available in containers
module(load="imuxsock") # provides support for local system logging

# Log auth messages (including SSH) to auth.log
auth,authpriv.*                 /var/log/auth.log

# All other logs
*.*;auth,authpriv.none          -/var/log/syslog
